name: "RDP Debug via Tailscale (6 hours)"

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Set RDP Password
        # <<< EDIT YOUR PASSWORD HERE >>>
        run: net user runneradmin "YOUR_SECURE_PASSWORD_HERE"
        shell: powershell

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscaleUri = "https://pkgs.tailscale.com/stable/tailscale-setup.exe"
          $tailscaleOut = "C:\TailscaleSetup.exe"
          try {
            Invoke-WebRequest -Uri $tailscaleUri -OutFile $tailscaleOut
          } catch {
            Write-Error "Failed to download Tailscale. Check network connectivity or firewall settings."
            exit 1
          }
          try {
            Start-Process -FilePath $tailscaleOut -ArgumentList "/quiet" -Wait
          } catch {
            Write-Error "Failed to install Tailscale."
            exit 1
          }
        shell: powershell

      - name: Start Tailscale & join your network
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tsExe = 'C:\Program Files\Tailscale IPN\tailscale.exe'
          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale did not install correctly."
              exit 1
          }
          try {
            & $tsExe up --authkey $env:TAILSCALE_AUTHKEY --accept-routes=true --hostname github-runner
          } catch {
            Write-Error "Failed to start Tailscale. Check your TAILSCALE_AUTHKEY GitHub secret."
            exit 1
          }
        shell: powershell

      - name: Output connection info to summary
        run: |
          $ErrorActionPreference = 'Stop'
          $tsExe = 'C:\Program Files\Tailscale IPN\tailscale.exe'
          try {
            $tsIP = & $tsExe ip -4
            "## 🖥️ RDP Connection Details`n" +
            "**IP:** $tsIP`n" +
            "**Username:** runneradmin`n" +
            "**Password:** YOUR_SECURE_PASSWORD_HERE" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } catch {
            Write-Error "Could not get Tailscale IP information."
            exit 1
          }
        shell: powershell

      - name: Wait for 6 hours for remote debugging
        run: Start-Sleep -Seconds 21600
        shell: powershell
